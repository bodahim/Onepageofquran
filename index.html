<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صفحة واحدة من القرآن كل يوم</title>
<meta name="description" content="مصحف المدينة النبوية (طبعة مجمع الملك فهد) مع تذكير يومي يتابع وردك صفحة بصفحة">
<meta name="theme-color" content="#fff9e6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="Icons/icon-192.png">
<link rel="apple-touch-icon" href="Icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صفحة كل يوم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="data.js"></script>
<style>
/* ألوان مأخوذة من صفحة المصحف المرجعية: ورق كريمي، خط أسود، زخارف بنية */
:root{
  --paper:#fff9e6; --ink:#000000; --brown:#8a4400; --marker:#84633a;
  --pill:#f6ead4; --pillLine:#c8b394; --pillInk:#72502b;
  --muted:#8a7a60; --surface:#fffdf5; --line:#ecdfc3; --scrim:rgba(40,25,5,.35);
  --fs:20px; --lh:1.86;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --paper:#16130d; --ink:#f3e9d2; --brown:#d99a55; --marker:#c9a46c;
  --pill:#2a2318; --pillLine:#5a4a33; --pillInk:#e6cc9e;
  --muted:#a8977a; --surface:#211c14; --line:#3a3122; --scrim:rgba(0,0,0,.55);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brown);outline-offset:2px}

/* الشريط العلوي — مثل الصفحة المرجعية */
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 4px max(14px,env(safe-area-inset-left))}
.top .side{flex:1;display:flex;align-items:center;gap:8px}
.top .side.l{justify-content:flex-end}
.pill{border:1.5px solid var(--pillLine);background:var(--pill);color:var(--pillInk);border-radius:999px;
  padding:4px 14px;font-size:15px;line-height:1.5;white-space:nowrap}
.pill.surah{font-family:Amiri,serif;font-weight:700;font-size:17px;padding:2px 16px}
.icon{width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px;position:relative}
.icon svg{width:22px;height:22px;stroke:var(--brown);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon .grid{fill:var(--brown);stroke:none}
.dot{position:absolute;top:5px;left:6px;width:8px;height:8px;border-radius:50%;background:#c0392b}

/* الصفحة */
.stagewrap{flex:1;min-height:0;position:relative;display:flex}
#stage{flex:1;min-width:0;display:flex;padding:4px 10px;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.page{position:relative;margin:auto;transition:opacity .18s;transform-origin:center center}
.page.pinching{transition:none}
/* وضع ملء الشاشة: تختفي كل الأزرار وتبقى الصفحة */
body.immersive .top, body.immersive .wird, body.immersive .bottom, body.immersive .tabbar{display:none!important}
body.immersive #stage{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.page.fade{opacity:.3}
.lines{margin:0 auto}
.line{display:flex;justify-content:center;align-items:center;height:calc(var(--fs) * var(--lh));white-space:nowrap;
  font-size:var(--fs);color:var(--ink);direction:rtl}
.line.justify{justify-content:space-between}
.line.measure{width:max-content!important;justify-content:center!important}
.line span{display:inline-block;line-height:1}
.line span.ay{color:var(--marker)}
.line.head{padding:0 1%}
.head .frame{flex:1;height:80%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--marker);
  border-radius:8px;position:relative;font-family:Amiri,serif;font-weight:700;font-size:.8em;color:var(--brown);background:var(--pill)}
.head .frame::before,.head .frame::after{content:"";position:absolute;top:50%;width:14%;height:0;border-top:1.5px solid var(--marker)}
.head .frame::before{right:4%}.head .frame::after{left:4%}
.line.bsml{font-family:"Amiri Quran",serif;font-size:calc(var(--fs) * .92)}
.state{color:var(--muted);text-align:center;padding:40px 20px;line-height:1.8}

/* شريط الورد والتنقل */
.wird{display:flex;gap:8px;justify-content:center;padding:4px 14px 0;min-height:44px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:600;font-size:15px}
.btn.pri{background:var(--brown);color:var(--paper)}
.btn.sec{background:var(--pill);border:1.5px solid var(--pillLine);color:var(--pillInk)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:400;font-size:14px}
.btn.google{background:var(--surface);border:1.5px solid var(--pillLine);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn .ico{width:20px;height:20px;flex:0 0 20px}
.btn:disabled{opacity:.5}
.bottom{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.nav{height:40px;padding:0 14px;font-size:14px;display:flex;align-items:center}
.nav:disabled{opacity:.35}
.pg{flex:1;display:flex;justify-content:center}
.pg .pill{font-variant-numeric:tabular-nums;font-size:16px}

/* النوافذ السفلية */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;max-height:88vh;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;
  transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding:8px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:640px;margin:0 auto;
  border-top:1.5px solid var(--pillLine)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--pillLine);margin:4px auto 10px;border:0;padding:0}
.sheet h2{margin:0 0 10px;font-size:18px;color:var(--pillInk)}
.sc{overflow:auto;min-height:0}
.tabs{display:flex;background:var(--pill);border-radius:12px;padding:4px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-size:14px;color:var(--pillInk)}
.tabs button.on{background:var(--surface);font-weight:600}
.field{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--pillLine);background:var(--paper);color:var(--ink);font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;align-items:center}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.list .n{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--pillLine);font-size:13px;color:var(--pillInk)}
.list .nm{flex:1;font-family:Amiri,serif;font-size:19px}
.list .p{color:var(--muted);font-size:13px}
.list li.cur .n{background:var(--brown);border-color:var(--brown);color:var(--paper)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.bar{height:8px;border-radius:9px;background:var(--pill);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--brown);border-radius:9px}
.stats{display:flex;gap:8px;text-align:center}
.stats div{flex:1;background:var(--pill);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-size:20px;color:var(--pillInk)}
.stats small{color:var(--muted);font-size:12px}
.note{font-size:13px;color:var(--muted);line-height:1.7}
.ok{color:#2e7d4f;font-weight:600}
:root[data-theme="dark"] .ok{color:#7fcf9f}
.err{color:#b3261e;font-size:13px;min-height:1em}
.lbl{font-size:13px;color:var(--muted);margin:2px 0 6px}
.stack>*+*{margin-top:8px}
.link{background:none;border:0;color:var(--brown);font-size:13px;padding:4px 0;text-decoration:underline}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.hero{text-align:center;padding:6px 0 4px}
.hero .logo{width:76px;height:76px;border-radius:20px}
.hero h1{font-family:Amiri,serif;margin:8px 0 2px;font-size:26px;color:var(--brown);text-wrap:balance}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:var(--pillInk);color:var(--paper);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ===== الواجهات: الرئيسية (أخضر داكن وذهبي) + المصحف (كريمي) ===== */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none!important}
.theme-green{
  --paper:#0b1a17; --ink:#e8efe9; --brown:#d9b56a; --marker:#d9b56a;
  --pill:#12302a; --pillLine:#24453c; --pillInk:#d9e6df;
  --muted:#8fa69e; --surface:#102421; --line:#1d3a33;
  --gold:#d9b56a; --green:#1f8a63; --mint:#7fd0a4;
  color-scheme: dark;
}
.view.theme-green{background:var(--paper);color:var(--ink)}
.hhead{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));
  border-bottom:1px solid var(--line);background:#0d1f1b}
.brand{flex:1;display:flex;align-items:center;gap:10px}
.brand .star{color:var(--gold);font-size:26px;line-height:1}
.brand b{display:block;font-family:"Aref Ruqaa",Amiri,serif;font-weight:700;color:var(--gold);font-size:28px;line-height:1.15}
.brand small{display:block;color:#c9d6cf;font-size:14px}
.circle{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;flex:0 0 44px}
.circle svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hscroll{flex:1;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.hscroll>*{flex-shrink:0}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.hero2{position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.012) 9px 10px),var(--surface)}
.hero2::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #5b5434;color:var(--gold);background:rgba(217,181,106,.08);border-radius:999px;padding:5px 14px;font-size:14px}
.chip .ico{width:16px;height:16px}
.bignum{display:flex;align-items:center;gap:18px;margin:14px 0 6px}
.bignum .num{font-family:"Aref Ruqaa",Amiri,serif;font-weight:700;color:var(--gold);font-size:72px;line-height:1.1;font-variant-numeric:tabular-nums}
.bignum b{display:block;font-size:19px;font-weight:600}
.bignum small{color:var(--muted);font-size:14px}
.lead{color:#c9d6cf;font-size:15px;line-height:1.8;margin:6px 0 16px}
.brow{display:flex;gap:10px;flex-wrap:wrap}
.gbtn{border:0;border-radius:14px;padding:12px 20px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.gbtn.gold{background:var(--gold);color:#1a1405}
.gbtn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.gbtn .ico{width:20px;height:20px}
.prog-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog-h b{font-size:17px}
.prog-h span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.gbar{height:10px;border-radius:9px;background:#163029;overflow:hidden;margin:14px 0 16px}
.gbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(270deg,var(--gold),#7f9a62 55%,var(--green));margin-right:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;background:#0d201c}
.tile .ico{color:var(--gold);width:20px;height:20px}
.tile b{display:block;font-size:24px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.rem-h{display:flex;align-items:center;gap:12px}
.rem-h .bell{width:48px;height:48px;border-radius:50%;background:#123a30;color:var(--mint);display:grid;place-items:center;flex:0 0 48px}
.rem-h .t{flex:1;min-width:0}
.rem-h .t b{display:block;font-size:17px}
.rem-h .t small{color:var(--muted);font-size:13px}
.badge{border:1px solid #2f6b55;color:var(--mint);border-radius:999px;padding:4px 14px;font-size:13px;white-space:nowrap}
.badge.off{border-color:var(--line);color:var(--muted)}
.days{display:flex;justify-content:space-between;gap:4px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0}
.day i{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.has i{background:#123a30;border-color:#2f6b55;color:var(--mint)}
.day.today i{border-color:var(--green);border-width:1.5px}
.day small{color:var(--muted);font-size:12px}
.day.today small{color:var(--gold)}
.acc-title{font-size:20px;margin:2px 0 0}
.view.theme-green .card{background:var(--surface);border-color:var(--line)}
.view.theme-green h2{color:var(--ink)}
/* شريط التبويبات */
.tabbar{display:flex;background:#0d1f1b;border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:13px}
.tabbar button .ico{width:24px;height:24px}
.tabbar button.on{color:var(--gold)}
</style>
</head>
<body>

<!-- ============ الرئيسية ============ -->
<section class="view theme-green" id="vHome">
  <header class="hhead">
    <div class="brand"><span class="star">✦</span><div><b id="hTitle">صفحة واحدة</b><small id="hSub">من القرآن كل يوم</small></div></div>
    <button class="circle" id="hAcc" aria-label="حسابي"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
  </header>
  <div class="hscroll" id="homeBody"></div>
</section>

<!-- ============ حسابي ============ -->
<section class="view theme-green" id="vAccount" hidden>
  <header class="hhead">
    <div class="brand"><span class="star">✦</span><div><b>حسابي</b><small>السجل والتذكير والإعدادات</small></div></div>
  </header>
  <div class="hscroll" id="accBody"></div>
</section>

<!-- ============ المصحف ============ -->
<section class="view" id="vMushaf" hidden>
<header class="top">
  <div class="side">
    <button class="pill surah" id="tSurah" aria-label="فهرس السور">—</button>
  </div>
  <button class="icon" id="bIndex" aria-label="الفهرس"><svg viewBox="0 0 24 24"><rect class="grid" x="4" y="4" width="7" height="7" rx="2"/><rect class="grid" x="13" y="4" width="7" height="7" rx="2"/><rect class="grid" x="4" y="13" width="7" height="7" rx="2"/><rect class="grid" x="13" y="13" width="7" height="7" rx="2"/></svg></button>
  <div class="side l">
    <button class="pill" id="tJuz" aria-label="فهرس الأجزاء">الجزء ١</button>
    <button class="icon" id="bHome" aria-label="الصفحة الرئيسية"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></button>
  </div>
</header>

<div class="stagewrap">
  <main id="stage"><div class="state">جارٍ التحميل…</div></main>
</div>

<div class="wird" id="wirdBar"></div>

<footer class="bottom">
  <button class="pill nav" id="bPrev" aria-label="الصفحة السابقة">→ السابقة</button>
  <div class="pg"><span class="pill" id="pg">١</span></div>
  <button class="pill nav" id="bNext" aria-label="الصفحة التالية">التالية ←</button>
</footer>
</section>

<nav class="tabbar theme-green" aria-label="التنقل">
  <button data-v="home" class="on"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>الرئيسية</button>
  <button data-v="mushaf"><svg class="ico" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>المصحف</button>
  <button data-v="account"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>حسابي</button>
</nav>

<div class="scrim" id="scrim"></div>

<!-- الفهرس -->
<section class="sheet" id="shIndex" aria-label="الفهرس">
  <button class="grab" aria-label="إغلاق"></button>
  <div class="tabs"><button class="on" data-tab="s">السور</button><button data-tab="j">الأجزاء</button></div>
  <div class="row" style="margin-bottom:6px">
    <input class="field" id="qSearch" placeholder="ابحث عن سورة…" autocomplete="off">
    <input class="field" id="qPage" type="number" inputmode="numeric" min="1" max="604" placeholder="صفحة" style="width:96px">
  </div>
  <div class="sc"><ul class="list" id="idxList"></ul></div>
</section>


<!-- الترحيب -->
<section class="sheet theme-green" id="shWelcome" aria-label="مرحبًا">
  <button class="grab" aria-label="إغلاق"></button>
  <div class="sc stack">
    <div class="hero">
      <img class="logo" src="Icons/icon-192.png" alt="">
      <h1 id="wName"></h1>
      <div class="note" id="wTag"></div>
    </div>
    <div class="card note">اقرأ صفحة واحدة على الأقل كل يوم. عندما تنتهي من صفحة اضغط «قرأت هذه الصفحة»، وسيذكّرك التطبيق في الموعد الذي تختاره بالصفحة التالية مباشرة.</div>
    <button class="btn pri wide" id="wStart">ابدأ من سورة الفاتحة</button>
    <button class="btn sec wide" id="wPick">اختر صفحة البداية</button>
    <button class="btn ghost wide" id="wLogin" hidden>لديك حساب؟ سجّل الدخول لاسترجاع سجلك</button>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const C = self.APP_CONFIG || {}, Q = self.QDATA;
const API = "https://api.quran.com/api/v4";
const FONT = "https://static.qurancdn.com/fonts/quran/hafs/v2/woff2";
const FB_V = "10.12.2";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- الحالة المحفوظة ---------- */
const KEY = "wird.v1";
const today = () => new Date().toLocaleDateString("en-CA");
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toLocaleDateString("en-CA"); };
let S = { current: 1, wird: 1, done: 0, khatmat: 0, streak: 0, lastReadDay: "", updatedAt: 0,
          time: C.defaultTime || "20:00", remote: false, member: false, email: "", seen: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let DEV = "";
try { DEV = localStorage.getItem("wird.dev") || ""; if (!DEV) { DEV = "d" + Math.random().toString(36).slice(2, 12); localStorage.setItem("wird.dev", DEV); } } catch (e) { DEV = "d" + Date.now(); }

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3000); }
const clamp = p => Math.min(Q.TOTAL, Math.max(1, p | 0));

/* ---------- تحميل بيانات الصفحة والخط ---------- */
const dataCache = new Map(), fontCache = new Map();
function getPage(p) {
  if (dataCache.has(p)) return dataCache.get(p);
  const pr = (async () => {
    let verses = [], pageNo = 1;
    for (;;) {
      const r = await fetch(`${API}/verses/by_page/${p}?words=true&word_fields=code_v2,line_number&per_page=50&page=${pageNo}`);
      if (!r.ok) throw new Error("http " + r.status);
      const j = await r.json();
      verses = verses.concat(j.verses || []);
      if (!j.pagination || !j.pagination.next_page) break;
      pageNo = j.pagination.next_page;
    }
    return verses;
  })();
  dataCache.set(p, pr); pr.catch(() => dataCache.delete(p));
  return pr;
}
function getFont(p) {
  if (fontCache.has(p)) return fontCache.get(p);
  const f = new FontFace("qcf" + p, `url(${FONT}/p${p}.woff2) format("woff2")`, { display: "block" });
  const pr = f.load().then(ff => { document.fonts.add(ff); return true; });
  fontCache.set(p, pr); pr.catch(() => fontCache.delete(p));
  return pr;
}
const preload = p => { if (p >= 1 && p <= Q.TOTAL) { getPage(p).catch(() => {}); getFont(p).catch(() => {}); } };

/* ---------- بناء أسطر الصفحة (15 سطرًا) ---------- */
function buildLines(verses, p) {
  const L = {}, starts = [];
  let lastCh = 1, lastLine = 0;
  for (const v of verses) {
    const ch = +v.verse_key.split(":")[0];
    lastCh = ch;
    if (v.verse_number === 1 && v.words.length) starts.push({ ch, line: v.words[0].line_number });
    for (const w of v.words) {
      (L[w.line_number] ||= { t: "w", g: [] }).g.push({ c: w.code_v2, end: w.char_type_name === "end" });
      if (w.line_number > lastLine) lastLine = w.line_number;
    }
  }
  for (const { ch, line } of starts) {
    if (ch === 1 || ch === 9) { if (line - 1 >= 1 && !L[line - 1]) L[line - 1] = { t: "h", ch }; }
    else {
      if (line - 1 >= 1 && !L[line - 1]) L[line - 1] = { t: "b" };
      if (line - 2 >= 1 && !L[line - 2]) L[line - 2] = { t: "h", ch };
    }
  }
  const max = p <= 2 ? lastLine : 15;
  if (p > 2 && lastLine < 15 && lastCh < 114) {
    const nx = lastCh + 1;
    L[lastLine + 1] = { t: "h", ch: nx };
    if (lastLine + 2 <= 15 && nx !== 9) L[lastLine + 2] = { t: "b" };
  }
  const out = [];
  for (let i = 1; i <= max; i++) out.push(L[i] || { t: "e" });
  return out;
}

/* ---------- العرض ---------- */
let renderToken = 0;
async function render(p) {
  const tok = ++renderToken;
  updateChrome(p);
  const stage = $("#stage");
  const old = stage.querySelector(".page");
  if (old) old.classList.add("fade");
  else stage.innerHTML = '<div class="state">جارٍ تحميل الصفحة…</div>';
  try {
    const [verses] = await Promise.all([getPage(p), getFont(p)]);
    if (tok !== renderToken) return;
    const lines = buildLines(verses, p);
    const page = document.createElement("div");
    page.className = "page" + (p <= 2 ? " opening" : "");
    const box = document.createElement("div"); box.className = "lines";
    for (const ln of lines) {
      const d = document.createElement("div");
      d.className = "line";
      if (ln.t === "w") {
        d.classList.add("w"); d.style.fontFamily = `qcf${p}, serif`;
        for (const g of ln.g) { const s = document.createElement("span"); s.textContent = g.c; if (g.end) s.className = "ay"; d.appendChild(s); }
      } else if (ln.t === "h") {
        d.classList.add("head");
        d.innerHTML = `<div class="frame">سورة ${Q.names[ln.ch - 1]}</div>`;
      } else if (ln.t === "b") { d.classList.add("bsml"); d.textContent = BASMALA; }
      box.appendChild(d);
    }
    page.appendChild(box);
    stage.innerHTML = ""; stage.appendChild(page);
    fit();
    stage.scrollTop = 0; stage.scrollLeft = 0; // ابدأ من أعلى يمين الصفحة
    preload(p + 1); preload(p - 1);
  } catch (e) {
    if (tok !== renderToken) return;
    stage.innerHTML = `<div class="state">تعذّر تحميل الصفحة ${toAr(p)}.<br>${navigator.onLine ? "تحقق من اتصالك بالإنترنت." : "أنت غير متصل، وهذه الصفحة غير محفوظة على جهازك.<br>حمّل المصحف كاملًا من «حسابي» ليعمل دون إنترنت."}<br><button class="btn sec" id="retry" style="margin-top:10px">إعادة المحاولة</button></div>`;
    $("#retry").onclick = () => render(p);
  }
}

function fit() {
  const page = $("#stage .page"); if (!page || !$("#stage").clientWidth) return;
  const box = page.querySelector(".lines");
  const opening = page.classList.contains("opening");
  const all = [...box.children], words = all.filter(l => l.classList.contains("w"));
  const BASE = 40;
  page.style.setProperty("--fs", BASE + "px");
  box.style.width = "auto"; box.style.paddingBlock = "0";
  words.forEach(l => { l.classList.remove("justify"); l.classList.add("measure"); });
  const nat = words.map(l => l.offsetWidth);
  words.forEach(l => l.classList.remove("measure"));
  const maxNat = Math.max(...nat, 1);
  const stage = $("#stage");
  const availW = stage.clientWidth - 20 - 4;   // المقاس الأصلي (100٪) يملأ الشاشة، ثم يُضرب في نسبة التكبير
  const availH = stage.clientHeight - 8 - 6;
  const lh = parseFloat(getComputedStyle(root).getPropertyValue("--lh")) || 1.86;
  let fs = opening
    ? Math.min(BASE * availW * 0.8 / maxNat, availH / ((all.length + 2) * lh))
    : Math.min(BASE * availW / maxNat, availH / (15 * lh));
  fs = Math.max(fs, 13) * (S.zoom || 1);
  page.style.setProperty("--fs", fs.toFixed(2) + "px");
  box.style.width = opening ? (availW * 0.9) + "px" : (maxNat * fs / BASE + 2) + "px";
  if (opening) box.style.paddingBlock = `${fs * lh * 0.9}px`;
  else words.forEach((l, i) => { if (nat[i] > maxNat * 0.8) l.classList.add("justify"); });
}
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fit, 120); });

function updateChrome(p) {
  $("#tSurah").textContent = Q.names[Q.surahOfPage(p) - 1];
  $("#tJuz").textContent = "الجزء " + toAr(Q.juzOfPage(p));
  $("#pg").textContent = toAr(p);
  $("#bPrev").disabled = p <= 1; $("#bNext").disabled = p >= Q.TOTAL;
  renderWirdBar();
}

/* ---------- التنقل ---------- */
function go(p, viaNext) {
  p = clamp(p);
  if (VIEW !== "mushaf") setView("mushaf", true);
  if (viaNext && S.current === S.wird && p === S.current + 1) markDone(S.current, true);
  S.current = p; save();
  try { history.replaceState(null, "", "?page=" + p); } catch (e) {}
  render(p);
}
$("#bNext").onclick = () => go(S.current + 1, true);
$("#bPrev").onclick = () => go(S.current - 1);
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") go(S.current + 1, true);
  if (e.key === "ArrowRight") go(S.current - 1);
});
/* ---------- التكبير والتصغير ---------- */
const ZMIN = 0.6, ZMAX = 3, ZSTEP = 0.2;
if (!S.zoom) S.zoom = 1;
const zclamp = z => Math.min(ZMAX, Math.max(ZMIN, Math.round(z * 100) / 100));
function updateZoomUI() {}
/* يغيّر الحجم مع إبقاء النقطة (fx,fy) من الشاشة في مكانها */
function setZoom(z, fx, fy) {
  z = zclamp(z);
  const st = $("#stage"), r = st.getBoundingClientRect();
  if (fx == null) { fx = r.left + st.clientWidth / 2; fy = r.top + st.clientHeight / 2; }
  const rx = (st.scrollLeft + fx - r.left) / Math.max(st.scrollWidth, 1);
  const ry = (st.scrollTop + fy - r.top) / Math.max(st.scrollHeight, 1);
  S.zoom = z; save(); fit(); updateZoomUI();
  st.scrollLeft = rx * st.scrollWidth - (fx - r.left);
  st.scrollTop = ry * st.scrollHeight - (fy - r.top);
}

/* ملء الشاشة: ضغطة واحدة على الصفحة تخفي الأزرار، وضغطة أخرى تعيدها */
let immersive = false;
function setImmersive(on) {
  immersive = on;
  document.body.classList.toggle("immersive", on);
  try {
    if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (e) {}
  requestAnimationFrame(fit);
  if (on) { try { if (!localStorage.getItem("wird.fsHint")) { toast("اضغط على الصفحة مرة أخرى لإظهار الأزرار"); localStorage.setItem("wird.fsHint", "1"); } } catch (e) {} }
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && immersive) { immersive = false; document.body.classList.remove("immersive"); requestAnimationFrame(fit); } });
$("#bHome").onclick = () => { setImmersive(false); setView("home"); };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "+" || e.key === "=") setZoom(S.zoom + ZSTEP);
  if (e.key === "-") setZoom(S.zoom - ZSTEP);
  if (e.key === "0") setZoom(1);
});
// الحاسوب: Ctrl + عجلة الفأرة (أو قرص اللمس)
$("#stage").addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault(); setZoom(S.zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
}, { passive: false });
// iOS: منع تكبير الصفحة كاملة، فنكبّر المصحف فقط
["gesturestart", "gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

/* اللمس: إصبعان = تكبير/تصغير، نقرتان = تبديل الحجم، سحب أفقي = تقليب الصفحة */
let sx = 0, sy = 0, pinch = null, multi = false, lastTap = 0, tapTimer = 0, lastTouch = 0;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const stageEl = $("#stage");
stageEl.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches, page = $("#stage .page");
    multi = true;
    pinch = { d0: dist(a, b), z0: S.zoom, z: S.zoom, fx: (a.clientX + b.clientX) / 2, fy: (a.clientY + b.clientY) / 2, page };
    if (page) {
      const pr = page.getBoundingClientRect();
      page.classList.add("pinching");
      page.style.transformOrigin = `${pinch.fx - pr.left}px ${pinch.fy - pr.top}px`;
    }
  } else if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; multi = false; }
}, { passive: true });
stageEl.addEventListener("touchmove", e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  pinch.z = zclamp(pinch.z0 * dist(e.touches[0], e.touches[1]) / pinch.d0);
  if (pinch.page) pinch.page.style.transform = `scale(${pinch.z / pinch.z0})`;
}, { passive: false });
stageEl.addEventListener("touchend", e => {
  if (pinch) {
    if (e.touches.length < 2) {
      const p = pinch; pinch = null;
      if (p.page) { p.page.style.transform = ""; p.page.style.transformOrigin = ""; p.page.classList.remove("pinching"); }
      setZoom(p.z, p.fx, p.fy);
    }
    return;
  }
  if (multi || e.touches.length) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  // نقرتان سريعتان: تكبير إلى ١٦٠٪ أو العودة للحجم الأصلي
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
    const now = Date.now();
    lastTouch = now;
    if (e.target.closest("button")) return;
    if (now - lastTap < 300) { clearTimeout(tapTimer); lastTap = 0; setZoom(S.zoom > 1.05 ? 1 : 1.6, t.clientX, t.clientY); }
    else { lastTap = now; tapTimer = setTimeout(() => setImmersive(!immersive), 300); }
    return;
  }
  // التقليب بالسحب فقط عندما تكون الصفحة غير مكبّرة (عند التكبير السحب يحرّك الصفحة)
  const st = stageEl, scrollableX = st.scrollWidth > st.clientWidth + 2;
  if (!scrollableX && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) dx > 0 ? go(S.current + 1, true) : go(S.current - 1);
}, { passive: true });

// الحاسوب: نقرة بالفأرة تبدّل ملء الشاشة، ونقرتان تكبّران
stageEl.addEventListener("click", e => {
  if (Date.now() - lastTouch < 800 || e.target.closest("button")) return;
  if (e.detail === 2) { clearTimeout(tapTimer); setZoom(S.zoom > 1.05 ? 1 : 1.6, e.clientX, e.clientY); }
  else if (e.detail === 1) tapTimer = setTimeout(() => setImmersive(!immersive), 300);
});

/* ---------- الورد ---------- */
function touch() { S.updatedAt = Date.now(); save(); }
function markDone(p, silent) {
  const t = today();
  if (S.lastReadDay !== t) S.streak = (S.lastReadDay === yesterday() ? S.streak : 0) + 1;
  S.lastReadDay = t; S.done++;
  S.log = S.log || {}; S.log[t] = (S.log[t] || 0) + 1;
  const old = new Date(); old.setDate(old.getDate() - 60); const cut = old.toLocaleDateString("en-CA");
  for (const k of Object.keys(S.log)) if (k < cut) delete S.log[k];
  if (p >= Q.TOTAL) { S.khatmat++; S.wird = 1; toast("مبارك! أتممت ختمة كاملة 🎉 يبدأ وردك من جديد"); }
  else { S.wird = p + 1; if (!silent) toast(`أحسنت 🌿 وردك القادم: صفحة ${toAr(S.wird)}`); }
  touch(); renderWirdBar(); syncRemote(); prefetchAhead();
}
function renderWirdBar() {
  const bar = $("#wirdBar"); bar.innerHTML = "";
  const b = (cls, txt, fn) => { const x = document.createElement("button"); x.className = "btn " + cls; x.textContent = txt; x.onclick = fn; bar.appendChild(x); };
  if (S.current === S.wird) {
    b("pri", "✓ قرأت هذه الصفحة", () => { markDone(S.current); if (S.current < Q.TOTAL) go(S.current + 1); });
  } else {
    b("sec", `اذهب إلى وردك (ص ${toAr(S.wird)})`, () => go(S.wird));
    b("ghost", "اجعل وردي من هنا", () => { S.wird = S.current; touch(); renderWirdBar(); syncRemote(); toast(`أصبح وردك يبدأ من صفحة ${toAr(S.wird)}`); });
  }
}

/* ---------- النوافذ ---------- */
let openSheet = null;
function show(id) { hide(); openSheet = $(id); openSheet.classList.add("on"); $("#scrim").classList.add("on"); }
function hide() { if (openSheet) openSheet.classList.remove("on"); $("#scrim").classList.remove("on"); openSheet = null; }
$("#scrim").onclick = hide;
document.querySelectorAll(".grab").forEach(g => g.onclick = hide);

/* الفهرس */
let tab = "s";
function setTab(t) {
  tab = t; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === t));
  $("#qSearch").hidden = t !== "s"; renderIndex();
}
function renderIndex() {
  const q = $("#qSearch").value.trim(), ul = $("#idxList"), cs = Q.surahOfPage(S.current), cj = Q.juzOfPage(S.current);
  const items = tab === "s"
    ? Q.names.map((n, i) => ({ n: i + 1, name: n, p: Q.start[i], cur: i + 1 === cs })).filter(x => !q || x.name.includes(q))
    : Q.juz.map((p, i) => ({ n: i + 1, name: "الجزء " + toAr(i + 1), p, cur: i + 1 === cj }));
  ul.innerHTML = items.map(x => `<li data-p="${x.p}" class="${x.cur ? "cur" : ""}"><span class="n">${toAr(x.n)}</span><span class="nm">${x.name}</span><span class="p">ص ${toAr(x.p)}</span></li>`).join("");
}
function openIndex(t) {
  setTab(t); show("#shIndex");
  setTimeout(() => { const c = $("#idxList .cur"); if (c) c.scrollIntoView({ block: "center" }); }, 260);
}
$("#idxList").onclick = e => { const li = e.target.closest("li"); if (li) { hide(); go(+li.dataset.p); } };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#qSearch").oninput = renderIndex;
const jump = e => { if (e.target.value) { hide(); go(+e.target.value); e.target.value = ""; } };
$("#qPage").onkeydown = e => { if (e.key === "Enter") jump(e); };
$("#qPage").onchange = jump;
$("#bIndex").onclick = () => openIndex("s");
$("#tSurah").onclick = () => openIndex("s");
$("#tJuz").onclick = () => openIndex("j");

/* ======================================================
   Firebase: الحساب (حفظ السجل) + الإشعارات — مجاني
   ====================================================== */
let FB = null;
async function fbLoad() {
  if (FB) return FB;
  if (!C.firebase) throw Object.assign(new Error("no-config"), { code: "no-config" });
  const base = `https://www.gstatic.com/firebasejs/${FB_V}`;
  const [app, auth, fs, msg] = await Promise.all([
    import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`),
    import(`${base}/firebase-firestore.js`), import(`${base}/firebase-messaging.js`)]);
  const a = app.initializeApp(C.firebase);
  const au = auth.getAuth(a); au.languageCode = "ar";
  await au.authStateReady();
  FB = { a, au, auth, fs, msg, db: fs.getFirestore(a) };
  return FB;
}
async function ensureUser() { const F = await fbLoad(); if (!F.au.currentUser) await F.auth.signInAnonymously(F.au); return F; }
const uref = F => F.fs.doc(F.db, "users", F.au.currentUser.uid);
const tz = () => Intl.DateTimeFormat().resolvedOptions().timeZone;
const FAR = new Date("2999-01-01T00:00:00Z");
function nextDue() {
  const [h, m] = S.time.split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d <= new Date()) d.setDate(d.getDate() + 1);
  return d;
}
function progressPayload(F) {
  return {
    progress: { wird: S.wird, done: S.done, khatmat: S.khatmat, streak: S.streak, lastReadDay: S.lastReadDay || "", current: S.current, log: S.log || {}, updatedAt: S.updatedAt || 0 },
    nextPage: S.wird, lastReadDay: S.lastReadDay || "", updatedAt: F.fs.serverTimestamp()
  };
}
async function syncRemote(timeChanged) {
  if (!C.firebase || !(S.remote || S.member)) return;
  try {
    const F = await ensureUser();
    const data = progressPayload(F);
    if (timeChanged) Object.assign(data, { time: S.time, tz: tz(), nextDue: F.fs.Timestamp.fromDate(nextDue()) });
    await F.fs.setDoc(uref(F), data, { merge: true });
  } catch (e) { console.error("sync", e); }
}

/* دمج السجل: يُعتمد السجل الأكثر تقدمًا (لا يضيع تقدمك أبدًا) */
async function pullMerge(silent) {
  const F = await fbLoad();
  const snap = await F.fs.getDoc(uref(F));
  const r = snap.exists() ? snap.data() : null;
  const rp = r && r.progress;
  const score = o => (o.khatmat || 0) * 10000 + (o.done || 0) * 10 + ((o.wird || 1) > 1 ? 1 : 0);
  if (rp && (score(rp) > score(S) || (score(rp) === score(S) && (rp.updatedAt || 0) > (S.updatedAt || 0)))) {
    Object.assign(S, { wird: rp.wird || 1, done: rp.done || 0, khatmat: rp.khatmat || 0, streak: rp.streak || 0,
      lastReadDay: rp.lastReadDay || "", current: rp.current || rp.wird || 1, log: rp.log || S.log || {}, updatedAt: rp.updatedAt || Date.now() });

/* الإشعارات */
async function registerToken() {
  const F = await ensureUser();
  if (!(await F.msg.isSupported())) throw Object.assign(new Error("unsupported"), { code: "unsupported" });
  const reg = await navigator.serviceWorker.ready;
  const token = await F.msg.getToken(F.msg.getMessaging(F.a), { vapidKey: C.vapidKey, serviceWorkerRegistration: reg });
  if (!token) throw new Error("no-token");
  await F.fs.setDoc(uref(F), {
    ...progressPayload(F), tokens: { [DEV]: token }, enabled: true,
    time: S.time, tz: tz(), nextDue: F.fs.Timestamp.fromDate(nextDue())
  }, { merge: true });
  S.remote = true; save();
}
async function detachDevice() {
  if (!FB || !FB.au.currentUser) return;
  const F = FB, ref = uref(F);
  try {
    await F.fs.updateDoc(ref, { ["tokens." + DEV]: F.fs.deleteField() });
    const d = (await F.fs.getDoc(ref)).data() || {};
    if (!d.tokens || !Object.keys(d.tokens).length) await F.fs.updateDoc(ref, { enabled: false, nextDue: F.fs.Timestamp.fromDate(FAR) });
  } catch (e) { console.warn("detach", e); }
}
async function enablePush(btn) {
  btn.disabled = true; btn.textContent = "جارٍ التفعيل…";
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) throw Object.assign(new Error(), { code: "unsupported" });
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("لم يتم السماح بالإشعارات من إعدادات المتصفح"); renderRem(); return; }
    await registerToken();
    toast("تم تفعيل التذكير اليومي 🔔");
  } catch (e) {
    console.error(e);
    toast(e.code === "unsupported" ? "متصفحك لا يدعم الإشعارات — استخدم تذكير التقويم" : "تعذّر التفعيل، حاول مرة أخرى");
  }
  renderRem();
}
async function disablePush() { await detachDevice(); S.remote = false; save(); toast("تم إيقاف التذكير على هذا الجهاز"); renderRem(); }

async function afterLogin(F) {
  const u = F.au.currentUser;
  S.member = true; S.email = u.email || ""; save();
  await pullMerge();
  if (S.remote) { try { await registerToken(); } catch (e) { S.remote = false; save(); } }

async function switchAccount(F, signIn) {
  const wasRemote = S.remote;
  if (wasRemote) await detachDevice();
  try { await signIn(); }
  catch (e) { if (wasRemote) { try { await registerToken(); } catch (x) {} } throw e; }

async function loginGoogle() {
  const F = await fbLoad();
  const prov = new F.auth.GoogleAuthProvider();
  const cur = F.au.currentUser;
  try {
    if (cur && cur.isAnonymous) await F.auth.linkWithPopup(cur, prov);
    else await F.auth.signInWithPopup(F.au, prov);
  } catch (e) {
    if (e.code === "auth/credential-already-in-use") {
      const cred = F.auth.GoogleAuthProvider.credentialFromError(e);
      await switchAccount(F, () => F.auth.signInWithCredential(F.au, cred));
    } else throw e;
  }
  await afterLogin(F);
}
async function emailAuth(mode, email, pw) {
  const F = await fbLoad();
  const cur = F.au.currentUser;
  if (mode === "signup") {
    if (cur && cur.isAnonymous) await F.auth.linkWithCredential(cur, F.auth.EmailAuthProvider.credential(email, pw));
    else await F.auth.createUserWithEmailAndPassword(F.au, email, pw);
  } else {
    await switchAccount(F, () => F.auth.signInWithEmailAndPassword(F.au, email, pw));
  }
  await afterLogin(F);
}
async function logout() {
  try { if (S.remote) await detachDevice(); const F = await fbLoad(); await F.auth.signOut(F.au); } catch (e) { console.error(e); }

  if (!("caches" in window)) return 0;
  try {
    const keys = (await (await caches.open(DATA_CACHE)).keys()).map(r => r.url);
    const pages = new Set(), fonts = new Set();
    for (const u of keys) {
      let m = u.match(/verses\/by_page\/(\d+)\?/); if (m) pages.add(+m[1]);
      m = u.match(/woff2\/p(\d+)\.woff2/); if (m) fonts.add(+m[1]);
    }
    let n = 0; for (const p of pages) if (fonts.has(p)) n++;
    return n;
  } catch (e) { return 0; }
}
async function cachePage(c, p) {
  let got = 0;
  for (const u of [pageUrl(p), fontUrl(p)]) {
    if (await c.match(u, { ignoreVary: true })) continue;
    const r = await fetch(u, { mode: "cors" });
    if (!r.ok) throw new Error("http " + r.status);
    const b = await r.clone().blob(); got += b.size;
    await c.put(u, r);
  }
  return got;
}
function offlineHtml() {
  const d = OFF.done;
  if (OFF.busy) {
    const pct = Math.round((d || 0) / Q.TOTAL * 100);
    return `<div class="row" style="justify-content:space-between"><b>جارٍ تحميل المصحف…</b><span class="note">${toAr(d || 0)} / ${toAr(Q.TOTAL)}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="note">تم تنزيل ${toAr((OFF.bytes / 1048576).toFixed(1))} ميغابايت. يمكنك الاستمرار في استخدام التطبيق، وأبقِه مفتوحًا حتى يكتمل.</div>
      <button class="btn ghost wide" id="offStop">إيقاف التحميل</button>`;
  }
  if (d === Q.TOTAL) return `<div class="ok">✓ المصحف كاملًا محفوظ على جهازك</div><div class="note">جميع الصفحات الـ ${toAr(Q.TOTAL)} تعمل الآن بدون إنترنت.</div>`;
  return `<div class="note">${d ? `المحفوظ على جهازك: ${toAr(d)} من ${toAr(Q.TOTAL)} صفحة. ` : ""}حمّل المصحف كاملًا مرة واحدة ليعمل التطبيق بدون إنترنت في أي وقت. يُفضّل التحميل على شبكة Wi-Fi.</div>
    <button class="btn pri wide" id="offGo">⬇ تحميل المصحف للعمل دون إنترنت</button>`;
}
function bindOffline() {
  const go = $("#offGo"); if (go) go.onclick = downloadAll;
  const st = $("#offStop"); if (st) st.onclick = () => { OFF.stop = true; };
  if (OFF.done === null && !OFF.busy) offlineCount().then(n => { OFF.done = n; const c = $("#offCard"); if (c) { c.innerHTML = offlineHtml(); bindOffline(); } });
}
function refreshOffCard() { const c = $("#offCard"); if (c) { c.innerHTML = offlineHtml(); bindOffline(); } }
async function downloadAll() {
  if (OFF.busy) return;
  if (!("caches" in window)) { toast("متصفحك لا يدعم الحفظ دون إنترنت"); return; }
  if (!navigator.onLine) { toast("اتصل بالإنترنت أولًا لتحميل المصحف"); return; }
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  OFF.busy = true; OFF.stop = false; OFF.bytes = 0; refreshOffCard();
  const c = await caches.open(DATA_CACHE);
  const todo = []; for (let p = 1; p <= Q.TOTAL; p++) todo.push(p);
  let done = 0, failed = 0, last = 0;
  const worker = async () => {
    while (todo.length && !OFF.stop) {
      const p = todo.shift();
      try { OFF.bytes += await cachePage(c, p); done++; }
      catch (e) { failed++; if (!navigator.onLine) { OFF.stop = true; } }
      OFF.done = done;
      if (Date.now() - last > 400) { last = Date.now(); refreshOffCard(); }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
  OFF.busy = false; OFF.done = await offlineCount(); refreshOffCard();
  if (OFF.done === Q.TOTAL) toast("✓ اكتمل التحميل، المصحف يعمل الآن بدون إنترنت");
  else if (OFF.stop && !navigator.onLine) toast("انقطع الإنترنت، اضغط التحميل مرة أخرى لإكمال الباقي");
  else if (failed) toast(`تعذّر تحميل ${toAr(Q.TOTAL - OFF.done)} صفحة، اضغط التحميل مرة أخرى لإكمالها`);
}
// تحميل صامت لصفحات الورد القادمة حتى تكون جاهزة دون إنترنت
function prefetchAhead() {
  if (!("caches" in window) || !navigator.onLine) return;
  caches.open(DATA_CACHE).then(async c => {
    for (let p = S.wird; p < Math.min(Q.TOTAL, S.wird + 10) + 1; p++) { try { await cachePage(c, p); } catch (e) { return; } }
  }).catch(() => {});
}

/* ---------- الترحيب والتشغيل ---------- */
$("#wStart").onclick = () => { S.wird = 1; touch(); hide(); go(1); };
$("#wPick").onclick = () => { openIndex("s"); toast("اختر الصفحة ثم اضغط «اجعل وردي من هنا»"); };
if (C.firebase) { $("#wLogin").hidden = false; $("#wLogin").onclick = () => setView("account"); }

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e));
}

const qp = +new URLSearchParams(location.search).get("page");
if (qp) { S.current = clamp(qp); go(S.current); } else setView("home");
setTimeout(prefetchAhead, 3000);
if (!S.seen) { S.seen = true; save(); setTimeout(() => show("#shWelcome"), 400); }
document.fonts && document.fonts.ready.then(fit);

// مزامنة صامتة عند الفتح إذا كان المستخدم مسجلًا
if (C.firebase && S.member) fbLoad().then(F => {
  if (!F.au.currentUser || F.au.currentUser.isAnonymous) { S.member = false; save(); return; }
  return pullMerge(true);
}).catch(e => console.warn("startup sync", e));
})();
</script>
